<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our perfect day ♡</title>

<link rel="stylesheet" href="styles.css"></head>

<body>

    <section class="welcome">

        <img class="welcome-waves" src="images/stick3.png" alt="">
        <img class="welcome-sticker star-right" src="images/star.png" alt="">
        <img class="welcome-sticker dol-right" src="images/dol.png" alt="">

        <h1>welcome to our perfect day memories ♡</h1>

        <p>a collection of our perfect moments</p>

        <button id="enterButton">Click Here</button>

    </section>


    <div class="camera">

        <img class="sticker starfish" src="images/stick1.png" alt="">
        <img class="sticker shell" src="images/stick2.png" alt="">

        <h2 class="camera-title">Our digicam photos &lt;3</h2>

        <div class="camera-screen">

            <img id="photo" src="images/photo1.jpg" alt="memory">

            <img class="camera-body" src="images/cam.png" alt="camera">

        </div>

        <div class="controls">

            <button id="prev">◀</button>

            <span id="counter">1 / 6</span>

            <button id="next">▶</button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
